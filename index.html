<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Luke Wortsmann</title>
        <link rel="stylesheet" type="text/css" href="style.css" />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <script src="theme.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                var texts = [
                    "I am *Luke Wortsmann*.",
                    "I currently live in *Chicago*.",
                    "I studied *Physics* at the University of Illinois Urbana-Champaign.",
                    "I am a Quantitative Researcher, Data Scientist, and *Software Engineer*.",
                ];
                var typingContainers = [
                    document.getElementById("typingText1"),
                    document.getElementById("typingText2"),
                    document.getElementById("typingText3"),
                    document.getElementById("typingText4"),
                ];
                var typingSpeed = 30;
                var delayBetweenTexts = 300;

                function typeWriter(text, container, delay) {
                    var i = 0;
                    var highlighting = false;
                    setTimeout(function () {
                        var typingInterval = setInterval(function () {
                            if (i < text.length) {
                                if (text.charAt(i) == "*") {
                                    if (highlighting) {
                                        highlighting = false;
                                    } else {
                                        var span =
                                            document.createElement("span");
                                        span.className = "highlight";
                                        container.appendChild(span);
                                        highlighting = true;
                                    }
                                } else {
                                    var textNode =
                                        document.createTextNode(text.charAt(i));
                                    if (highlighting) {
                                        container.lastChild.appendChild(textNode);
                                    } else {
                                        container.appendChild(textNode);
                                    }
                                }
                                i++;
                            } else {
                                clearInterval(typingInterval);
                            }
                        }, typingSpeed);
                    }, delay);
                }

                texts.forEach((text, index) => {
                    typeWriter(
                        text,
                        typingContainers[index],
                        delayBetweenTexts * index,
                    );
                });

                // Color-square "slot machine": cycle through the palette while
                // the text types, then lock each box into its assigned color in
                // sequence, finishing as the last line completes.
                // The boxes flash through this whole pool while typing. The
                // first 7 entries, in DOM order, are each box's final "locked"
                // color; the rest are flash-only accents that never lock.
                var flashPalette = [
                    "#21201e", // grey-dark   (box 1 final)
                    "#b12c3b", // red         (box 2 final)
                    "#db9931", // gold        (box 3 final)
                    "#6f4e37", // brown       (box 4 final)
                    "#325941", // green       (box 5 final)
                    "#3e4ca1", // blue        (box 6 final)
                    "#d3d7d1", // grey-light  (box 7 final)
                    "#d66132", // orange
                    "#4d0300", // maroon
                    "#3f6f42", // green (alt)
                ];
                var squares = document.querySelectorAll(".color-squares span");
                var cycleSpeed = 90; // ms between color flickers
                var lockStart = 400; // ms before the first box locks

                // When does the typing finish? (max end time across all lines)
                var typingDone = 0;
                texts.forEach(function (text, index) {
                    typingDone = Math.max(
                        typingDone,
                        delayBetweenTexts * index + text.length * typingSpeed,
                    );
                });

                // While typing, each box locks to its own final color in turn.
                // A locked box "owns" that color; the unlocked boxes draw
                // distinct colors from everything still left in the pool, so no
                // two boxes ever show the same color at once.
                var locked = new Array(squares.length).fill(false);
                var step = 0;
                var cycleInterval = setInterval(function () {
                    step++;
                    var taken = [];
                    squares.forEach(function (sq, i) {
                        if (locked[i]) taken.push(flashPalette[i]);
                    });
                    var available = flashPalette.filter(function (c) {
                        return taken.indexOf(c) === -1;
                    });
                    var k = 0;
                    squares.forEach(function (sq, i) {
                        if (locked[i]) return;
                        sq.style.backgroundColor =
                            available[(step + k) % available.length];
                        k++;
                    });
                }, cycleSpeed);

                // Lock boxes one at a time, the last landing as typing ends.
                var lockGap = (typingDone - lockStart) / squares.length;
                squares.forEach(function (sq, i) {
                    setTimeout(function () {
                        locked[i] = true;
                        sq.style.backgroundColor = ""; // revert to class color
                    }, lockStart + lockGap * (i + 1));
                });

                setTimeout(function () {
                    clearInterval(cycleInterval);
                    squares.forEach(function (sq) {
                        sq.style.backgroundColor = "";
                    });
                }, typingDone + cycleSpeed);
            });
        </script>
    </head>
    <body>
        <nav>
            <a href="index.html" class="active">about</a>
            <a href="cv.html">cv</a>
            <a href="contact.html">contact</a>
            <button id="themeToggle" type="button"></button>
        </nav>

        <div class="content">
            <h1>About Me</h1>
            <p id="typingText1"></p>
            <p id="typingText2"></p>
            <p id="typingText3"></p>
            <p id="typingText4"></p>
        </div>

        <div class="color-squares" aria-hidden="true">
            <span class="sq-grey-dark"></span>
            <span class="sq-red"></span>
            <span class="sq-gold"></span>
            <span class="sq-brown"></span>
            <span class="sq-green"></span>
            <span class="sq-blue"></span>
            <span class="sq-grey-light"></span>
        </div>
    </body>
</html>
